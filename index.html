<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe5d3">
<title>おえかき暮らし</title>
<meta name="description" content="自分で描いた相棒と暮らす、お絵かきとお世話のゲーム。">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yomogi&family=Yusei+Magic&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 起動画面：読み込みのあいだタイトルを描き、終わったら「タップしてはじめる」。最初のタップで音も使えるようになる -->
<div id="splash" aria-live="polite">
  <div class="sp-title" aria-label="おえかき暮らし">
    <span class="sp-text" aria-hidden="true">おえかき暮らし</span>
    <svg class="sp-line" viewBox="0 0 300 16" preserveAspectRatio="none" aria-hidden="true"><path d="M4 9 C 40 3, 70 14, 110 8 S 180 4, 220 9 S 270 12, 296 6" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" pathLength="1"/></svg>
    <span class="sp-pen" aria-hidden="true"><span class="sp-jit"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 9-9-3-3-9 9z"/><path d="M18 2l.8 2.2L21 5l-2.2.8L18 8l-.8-2.2L15 5l2.2-.8z"/></svg></span></span>
  </div>
  <div class="sp-pet"></div>
  <p class="sp-status">じゅんびしています…</p>
</div>
<script>
// タイトルの字体が届いてから描きはじめる（届く前の仮の字体で描かないように）。届かなくても1.5秒で始める
(function () {
  var go = function () { document.getElementById('splash').classList.add('go'); };
  var t = setTimeout(go, 1500);
  if (document.fonts && document.fonts.load) document.fonts.load('48px "Yusei Magic"', 'おえかき暮らし').then(function () { clearTimeout(t); go(); }, function () {});
})();
</script>
<div id="world"></div>

<div id="hud">
  <div class="hud-head">
  <div class="hud-top">
    <div class="chips">
      <span class="chip"><i class="coin"></i><b id="coins">0</b></span>
      <span class="chip" id="day">1日目</span>
      <button class="chip chip-btn" id="memories-btn" aria-label="思い出"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="1"/><path d="M4 15l5-4 4 3 3-2 4 3"/></svg>思い出</button>
      <span class="chip warn" id="mode-chip" hidden>ハラハラ</span>
    </div>
    <nav id="places" aria-label="場所">
      <button data-page="room">おへや</button>
      <button data-page="cafe">カフェ</button>
      <button data-page="shop">コンビニ</button>
    </nav>
    <button class="round" id="settings" aria-label="設定">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
  <div id="status"></div>
  <div id="alert" hidden></div>
  </div>
  <div id="bubble-pet" class="bubble" hidden></div>
  <div id="bubble-guest" class="bubble guest" hidden></div>
  <button id="next-guest" class="next-guest" hidden>つぎのお客さま<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  <div id="actions"></div>
</div>

<div id="modal-root" hidden></div>
<div id="editor" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="errors" hidden></div>
<script>
// 起動時の不具合を画面に出す（試作用）
addEventListener("error", e => { const b = document.getElementById("errors"); b.hidden = false; b.textContent += (e.message || e) + "\n"; });
addEventListener("unhandledrejection", e => { const b = document.getElementById("errors"); b.hidden = false; b.textContent += String(e.reason && e.reason.message || e.reason) + "\n"; });
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
